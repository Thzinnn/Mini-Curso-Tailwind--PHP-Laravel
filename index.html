<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Catálogo de Filmes | Tailwind CSS</title>
</head>

<body class="bg-zinc-950 flex items-center justify-center w-full h-screen">

    <div class="flex items-center justify-center flex-col ">
        <div class="flex justify-start gap-4 items-center w-full">
            <div class="flex justify-center items-center bg-zinc-900 h-12 w-12 rounded-md">
                <button class="flex text-white"> <- </button>
            </div>
            <h3 class="flex text-zinc-500"> Voltar para Home</h3>
        </div>
        <div class="pt-4">
            <div class="flex-col justify-around items-center w-full h-full bg-zinc-900 rounded-xl p-6">
                <div class="">
                    <div class="flex items-center justify-center gap-4 w-full ">
                        <div class="w-16 h-16 bg-red-600 rounded-xl flex items-center justify-center ">
                            <h1 class="text-xl font-bold text-white">CF</h1>
                        </div>
                        <div>
                            <h1 class="texte-lg font-bold text-white">CineFilmes</h1>
                            <span class="text-zinc-500">Catálogo de Filmes<span>
                        </div>
                    </div>
                    <div class="flex justify-center items-center text-amber-400 my-5 ">
                        <h3>AREA ADMINISTRATIVA</h3>
                    </div>
                    <div class="flex justify-center my-5 text-white font-bold text-3xl text-center ">
                        <h3>Entrar no Cátalogo</h3>
                    </div>
                    <div class="flex justify-center ">
                        <h4 class="text-zinc-500">Acesse a área administrativa para gerenciar os filmes do cátalogo.
                        </h4>
                    </div>
                </div>
                <div class="">
                    <div class="flex-col flex justify-center  my-5">
                        <label for="" class="flex text-white mb-2">
                            E-mail
                        </label>
                        <input type="text" name="Email" id="Email" placeholder="Digite seu Email"
                            class=" placeholder:text-zinc-700 pl-4 flex bg-zinc-950 h-10 rounded-sm border border-zinc-600">
                    </div>
                    <div class="flex-col flex justify-center ">
                        <label for="" class="flex text-white mb-2">
                            Senha
                        </label>
                        <input type="text" name="Senha" id="Senha" placeholder="Digite sua senha"
                            class="placeholder:text-zinc-700 pl-4 flex bg-zinc-950 h-10 rounded-sm border border-zinc-600">
                    </div>
                    <div class=" py-5 ">
                        <div
                            class="flex items-center justify-center cursor-pointer hover:bg-red-500 transition bg-red-600 h-10 rounded-md">
                            <button class="flex">
                                <h5 class="flex text-white"> Entrar </h5>
                            </button>
                        </div>
                    </div>
                    <div class="flex items-center justify-center ">
                        <h4 class="flex text-zinc-700">Use suas credenciais de administrador para continuar</h4>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
